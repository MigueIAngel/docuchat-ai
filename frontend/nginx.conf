server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    # Stream Server-Sent Events token by token instead of buffering the answer.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
